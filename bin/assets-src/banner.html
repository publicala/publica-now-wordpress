<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Publica.now WordPress.org banner (source)</title>
<!--
	Source for .wordpress-org/banner-772x250.png and banner-1544x500.png.
	Designed at 772x250 CSS pixels; the retina banner is the same page
	rendered with a device scale factor of 2, so both files stay identical
	in composition. Everything is typographic: no photography, no AI art.

	Palette (docs/PLAN.md section 7): paper #FAFAF7, ink #1A1816,
	muted #6B6560, coral #E05A2B (used once, on a single cover).
-->
<style>
	html, body {
		margin: 0;
		padding: 0;
		width: 772px;
		height: 250px;
		overflow: hidden;
		background: #FAFAF7;
	}
	.banner {
		position: relative;
		width: 772px;
		height: 250px;
		box-sizing: border-box;
		background:
			radial-gradient(120% 140% at 0% 50%, rgba(255, 255, 255, 0.9) 0%, rgba(250, 250, 247, 0) 60%),
			#FAFAF7;
		color: #1A1816;
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
		-webkit-font-smoothing: antialiased;
	}
	/* Faint baseline rule that grounds the covers row, like a shelf edge. */
	.banner::after {
		content: "";
		position: absolute;
		left: 452px;
		right: 36px;
		top: 202px;
		height: 1px;
		background: rgba(26, 24, 22, 0.14);
	}

	/* Left: mark + wordmark + tagline */
	.brand {
		position: absolute;
		left: 40px;
		top: 62px;
		width: 400px;
	}
	.lockup {
		display: flex;
		align-items: center;
		gap: 16px;
	}
	.mark {
		width: 64px;
		height: 64px;
		flex: 0 0 64px;
		border-radius: 50%;
		/* The mark is a paper disc; on paper it needs an edge to read. */
		box-shadow:
			0 1px 2px rgba(26, 24, 22, 0.10),
			0 10px 24px -10px rgba(26, 24, 22, 0.28),
			inset 0 0 0 1px rgba(26, 24, 22, 0.08);
	}
	.mark svg {
		display: block;
		width: 64px;
		height: 64px;
	}
	.wordmark {
		font-family: "Instrument Serif", "New York", Georgia, "Times New Roman", serif;
		font-weight: 400;
		font-size: 46px;
		line-height: 1;
		letter-spacing: -0.015em;
		color: #1A1816;
		margin: 0;
	}
	.tagline {
		margin: 18px 0 0;
		max-width: 372px;
		font-size: 16px;
		line-height: 1.4;
		color: #6B6560;
		letter-spacing: 0.002em;
	}
	.tagline strong {
		font-weight: 600;
		color: #1A1816;
	}

	/* Right: a row of abstract typographic covers */
	.shelf {
		position: absolute;
		left: 458px;
		top: 0;
		width: 300px;
		height: 250px;
	}
	.cover {
		position: absolute;
		width: 90px;
		height: 135px; /* 2:3, matching the plugin's cover ratio */
		border-radius: 3px;
		box-sizing: border-box;
		padding: 10px 8px;
		display: flex;
		flex-direction: column;
		justify-content: space-between;
		box-shadow:
			0 1px 1px rgba(26, 24, 22, 0.12),
			0 14px 22px -12px rgba(26, 24, 22, 0.45),
			inset 1px 0 0 rgba(255, 255, 255, 0.18);
		font-family: "Instrument Serif", "New York", Georgia, "Times New Roman", serif;
	}
	/* Spine highlight: a 3px lighter band at the left edge. */
	.cover::before {
		content: "";
		position: absolute;
		left: 4px;
		top: 0;
		bottom: 0;
		width: 1px;
		background: rgba(255, 255, 255, 0.22);
	}
	.cover .eyebrow,
	.cover .format {
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
		font-size: 6.5px;
		letter-spacing: 0.14em;
		text-transform: uppercase;
		font-weight: 600;
		opacity: 0.8;
	}
	.cover .title {
		font-size: 13px;
		line-height: 1.08;
		margin: 0;
		font-weight: 400;
		overflow: hidden;
		white-space: nowrap;
	}
	.cover .title.big {
		font-size: 40px;
		line-height: 0.9;
		letter-spacing: -0.03em;
	}
	.cover .title em {
		font-style: italic;
	}
	.cover .rule {
		height: 1px;
		background: currentColor;
		opacity: 0.35;
		margin: 6px 0;
	}

	.c1 { left: 4px;   top: 74px; background: #1A1816; color: #FAFAF7; transform: rotate(-7deg); z-index: 1; }
	.c2 { left: 72px;  top: 62px; background: #FAFAF7; color: #1A1816; border: 1.5px solid #1A1816; transform: rotate(-2.5deg); z-index: 2; }
	.c3 { left: 140px; top: 56px; background: #E05A2B; color: #FAFAF7; transform: rotate(2deg); z-index: 3; }
	.c4 { left: 206px; top: 68px; background: #E8E3DA; color: #1A1816; transform: rotate(6deg); z-index: 4; }
</style>
</head>
<body>
	<div class="banner">
		<div class="brand">
			<div class="lockup">
				<div class="mark">
					<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#FAFAF7"/><path d="M14 10V30" stroke="#1A1816" stroke-width="3.5" stroke-linecap="round"/><path d="M14 10H22C25.3137 10 28 12.6863 28 16C28 19.3137 25.3137 22 22 22H14" stroke="#E05A2B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="14" cy="10" r="1.75" fill="#1A1816"/></svg>
				</div>
				<h1 class="wordmark">Publica.now</h1>
			</div>
			<p class="tagline">Sell <strong>ebooks, audiobooks, video &amp; printed books</strong> from your WordPress site. Checkout, delivery and payouts stay on publica.now.</p>
		</div>

		<div class="shelf" aria-hidden="true">
			<div class="cover c1">
				<div class="eyebrow">Novel</div>
				<div><p class="title big">N</p><div class="rule"></div><p class="title"><em>Nocturnes</em></p></div>
				<div class="format">EPUB</div>
			</div>
			<div class="cover c2">
				<div class="eyebrow">Memoir</div>
				<div><p class="title"><em>Field<br>Notes</em></p><div class="rule"></div><p class="title big">II</p></div>
				<div class="format">Audiobook</div>
			</div>
			<div class="cover c3">
				<div class="eyebrow">Course</div>
				<div><p class="title big">8</p><div class="rule"></div><p class="title">Lessons<br>on light</p></div>
				<div class="format">Video</div>
			</div>
			<div class="cover c4">
				<div class="eyebrow">Zine</div>
				<div><p class="title">Essays<br>on <em>Paper</em></p><div class="rule"></div><p class="title big">&amp;</p></div>
				<div class="format">Print</div>
			</div>
		</div>
	</div>
</body>
</html>
