# Continuous integration for the Publica.now WordPress plugin.
#
# Every push and pull request runs:
#   1. coding standards (PHPCS: WordPress + WordPress-Extra + PHPCompatibilityWP 7.4-)
#      and a php -l syntax pass, on the oldest (7.4) and a current (8.3) PHP;
#   2. a syntax check of the block editor scripts (plain ES5/ES2015, no build);
#   3. the distributable zip, built by bin/build-zip.sh, kept as an artifact;
#   4. Plugin Check with the same category WordPress.org runs on upload
#      (plugin_repo), executed against the built zip contents.
#
# Nothing here deploys. Publishing to WordPress.org is deploy.yml, on release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }} lint + PHPCS
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            image: php:7.4.33-cli-bullseye@sha256:620a6b9f4d4feef2210026172570465e9d0c1de79766418d3affd09190a7fda5
          - php: '8.3'
            image: php:8.3.33-cli-bookworm@sha256:177529735599a8244b2c903522f029839dce1c2ac4be122fdc00ada4b45a20e4
    steps:
      - name: Install container tools
        run: apt-get update -qq && apt-get install -y --no-install-recommends git unzip

      - name: Check out
        uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: publicala/php-ci-static@2c0c05d9fa46b77b34b199f7a76e3b8ae75e7991 # v1.9.0 candidate
        with:
          php-version: ${{ matrix.php }}
          runtime: system
        env:
          # Composer uses this to raise the GitHub API rate limit when resolving packages.
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Composer dev dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: --no-interaction --prefer-dist --no-progress

      - name: PHP syntax (php -l on every plugin file)
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null || status=1
          done < <(find . -path ./vendor -prune -o -path ./node_modules -prune -o -path ./dist -prune -o -name '*.php' -print0)
          exit "$status"

      - name: PHPCS (WordPress, WordPress-Extra, PHPCompatibilityWP)
        run: vendor/bin/phpcs --report=full --report-checkstyle=./phpcs-report.xml

      - name: Upload PHPCS report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: phpcs-report-php${{ matrix.php }}
          path: phpcs-report.xml
          if-no-files-found: ignore

  javascript:
    name: Block scripts syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: node --check blocks/*/index.js and assets/js/*.js
        run: |
          set -euo pipefail
          found=0
          for file in blocks/*/index.js assets/js/*.js; do
            [ -e "$file" ] || continue
            found=1
            echo "checking $file"
            node --check "$file"
          done
          if [ "$found" -eq 0 ]; then
            echo "::warning::no JavaScript files found to check"
          fi

      - name: Validate block.json files
        run: |
          set -euo pipefail
          for file in blocks/*/block.json; do
            [ -e "$file" ] || continue
            echo "parsing $file"
            node -e "const b = require('./$file'); if (!b.name || !b.name.startsWith('publica-now/')) { throw new Error('$file: block name must be namespaced publica-now/'); } if (b.apiVersion !== 3) { throw new Error('$file: apiVersion must be 3 for the WordPress 7.x iframed editor'); }"
          done

  build:
    name: Build distributable zip
    runs-on: ubuntu-latest
    needs: [php, javascript]
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up PHP (for php -l inside the build script)
        uses: publicala/php-ci-static@v1
        with:
          php-version: '8.3'

      - name: Build
        id: build
        run: |
          set -euo pipefail
          bash bin/build-zip.sh
          version="$(sed -nE 's/^[[:space:]]*\*?[[:space:]]*Version:[[:space:]]*([0-9][0-9.]*)[[:space:]]*$/\1/p' publica-now.php | head -n1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: publica-now-${{ steps.build.outputs.version }}
          path: dist/publica-now-${{ steps.build.outputs.version }}.zip
          if-no-files-found: error

      - name: Upload unpacked build (for Plugin Check)
        uses: actions/upload-artifact@v7
        with:
          name: publica-now-build-dir
          path: dist/publica-now
          if-no-files-found: error

  contract:
    name: Normalisation contract test
    runs-on: ubuntu-latest
    needs: [php]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wp-env
        run: npm ci --no-audit --no-fund

      # wp-env boots WordPress in Docker (available on ubuntu-latest runners),
      # so the fixtures run against the real esc_url_raw / wp_strip_all_tags
      # rather than stubs. docs/PLAN.md §9 item 8.
      - name: Start WordPress
        run: npx wp-env start

      # wp-env mounts the plugin but does not activate it, and the contract
      # test refuses to run against an inactive plugin (it would silently
      # test nothing). A local checkout usually has it active already, which
      # is exactly why this was missing.
      - name: Activate the plugin
        run: npx wp-env run cli wp plugin activate publica-now

      - name: Run the contract test
        run: npx wp-env run cli wp eval-file wp-content/plugins/publica-now/tests/contract-test.php

      - name: Stop WordPress
        if: always()
        run: npx wp-env stop || true

  plugin-check:
    name: Plugin Check (plugin_repo)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download unpacked build
        uses: actions/download-artifact@v8
        with:
          name: publica-now-build-dir
          path: dist/publica-now

      # Runs the same checks WordPress.org runs on upload. The plugin is scanned
      # from the built directory so dev files can never cause false positives.
      # "prefixing" is excluded by the WordPress.org gate itself but reviewers
      # look at it by hand, so it stays on here.
      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: dist/publica-now
          categories: |
            plugin_repo
          exclude-directories: |
            vendor
            node_modules
          strict: false

  # The org ruleset on main requires one status check named exactly
  # "ci-success", so every job above has to funnel into a single aggregate.
  # Without it no pull request in this repository can ever merge: the check
  # is required, nothing produces it, and the branch stays BLOCKED forever.
  # alls-green is what publicala/publicanow uses for the same purpose; the
  # action is pinned to a commit SHA rather than a tag because it decides
  # whether protected branches accept a merge.
  #
  # `if: !cancelled()` so that a cancelled run reports honestly instead of
  # counting as green, and `jobs: toJSON(needs)` so a job that is skipped or
  # fails is treated as failure — a bare `needs:` alone would let a skipped
  # job pass silently.
  ci-success:
    name: ci-success
    if: ${{ !cancelled() }}
    needs: [php, javascript, build, contract, plugin-check]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
